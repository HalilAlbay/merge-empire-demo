<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge Empire Demo</title><style>body{font-family:system-ui;background:#f5ead6;text-align:center;margin:0;padding:12px;color:#453a31}main{max-width:500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cell{aspect-ratio:1;background:white;border:2px solid #dfcda8;border-radius:8px;font-size:28px;touch-action:none}.sel{border-color:#298cdd;background:#d7edff}button{background:#258c6d;color:white;border:0;border-radius:9px;padding:10px;margin:4px}.orders{display:flex;justify-content:space-around}.orders>div{background:white;padding:8px;border-radius:8px;flex:1;margin:3px}small{display:block}</style><main><h1>🍽️ Merge Empire</h1><p id="status"></p><h3>Siparişler</h3><div id="orders" class="orders"></div><h3>7×9 Birleştirme Tahtası</h3><div id="grid" class="grid"></div><h3>Üreticiler</h3><button onclick="spawn(0)">🥖 Fırın ⚡1</button><button onclick="spawn(1)">☕ Kahve ⚡1</button><button onclick="bonus()">🎁 +20 Enerji (Demo)</button><p id="msg">Ürün üret; aynı ürünleri seçerek birleştir.</p><button onclick="reset()">Oyunu sıfırla</button><small>Demo: reklam ve satın alma simülasyonu. Yerel kayıt.</small></main><script>const icons=[['🌾','🥣','🍞','🥖','🥪','🥐','🥙','🍱','🧺','🍽️'],['🫘','🥄','☕','🥤','🧋','🥛','🍫','🍨','🎁','🏆']],key='merge-empire-demo-1';let s;try{s=JSON.parse(localStorage.getItem(key))}catch{}if(!s||!Array.isArray(s.board)||s.board.length!==63)s={board:Array(63).fill(null),energy:100,coins:0,xp:0,level:1,used:[0,0],rest:[0,0],orders:[],last:Date.now()};let sel=-1;function order(){return{t:Math.random()<.5?0:1,l:1+Math.floor(Math.random()*Math.min(4,1+Math.floor(s.level/2)))}}function save(){localStorage.setItem(key,JSON.stringify(s))}function tick(){let n=Math.floor((Date.now()-s.last)/120000);if(n>0){s.energy=Math.min(100,s.energy+n);s.last+=n*120000}for(let i=0;i<2;i++)if(s.rest[i]&&Date.now()>=s.rest[i]){s.rest[i]=0;s.used[i]=0}}function spawn(t){tick();if(s.rest[t]>Date.now())return msg('Üretici dinleniyor');if(s.energy<1)return msg('Enerji bitti');let i=s.board.indexOf(null);if(i<0)return msg('Tahta dolu');s.board[i]={t,l:1};s.energy--;s.used[t]++;if(s.used[t]>=30)s.rest[t]=Date.now()+120000;render()}function move(i){if(sel<0){if(s.board[i])sel=i;return render()}if(sel===i){sel=-1;return render()}let a=s.board[sel],b=s.board[i];if(a&&b&&a.t===b.t&&a.l===b.l&&a.l<10){s.board[i]={t:a.t,l:a.l+1};s.board[sel]=null;msg('Birleştirildi!')}else if(a&&!b){s.board[i]=a;s.board[sel]=null}else msg('Aynı ürün ve seviye gerekli');sel=-1;render()}function deliver(i){let o=s.orders[i],j=s.board.findIndex(x=>x&&x.t===o.t&&x.l===o.l);if(j<0)return;s.board[j]=null;s.coins+=15*Math.pow(2,o.l-1);s.xp+=10*o.l;if(s.xp>=100){s.xp-=100;s.level++}s.orders[i]=order();render()}function msg(x){document.getElementById('msg').textContent=x}function render(){tick();while(s.orders.length<3)s.orders.push(order());document.getElementById('status').textContent='🏪 Seviye '+s.level+' | 🪙 '+s.coins+' | ⚡ '+s.energy+'/100 | XP '+s.xp+'/100';document.getElementById('grid').innerHTML=s.board.map((x,i)=>'<div class="cell '+(sel===i?'sel':'')+'" data-i="'+i+'">'+(x?icons[x.t][x.l-1]+'<small>'+x.l+'</small>':'')+'</div>').join('');document.querySelectorAll('.cell').forEach(el=>el.onclick=()=>move(+el.dataset.i));document.getElementById('orders').innerHTML=s.orders.map((o,i)=>'<div>'+icons[o.t][o.l-1]+'<small>Seviye '+o.l+' · 🪙 '+15*Math.pow(2,o.l-1)+'</small><button '+(!s.board.some(x=>x&&x.t===o.t&&x.l===o.l)?'disabled':'')+' onclick="deliver('+i+')">Teslim et</button></div>').join('');save()}function bonus(){s.energy=Math.min(100,s.energy+20);render()}function reset(){if(confirm('İlerleme silinsin mi?')){localStorage.removeItem(key);location.reload()}}render();setInterval(render,10000)</script></html>
