<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Merge Empire 3D Kurtarma</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui;background:#9bd4e5}canvas{display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #183d30}header{position:absolute;top:env(safe-area-inset-top);left:8px;right:8px;display:flex;justify-content:space-between;gap:8px}.panel{background:#214e3de9;border:2px solid #e8c277;border-radius:15px;padding:12px;max-width:220px}h3{margin:0 0 8px;font-size:15px}.bar{height:12px;background:#20382f;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#53c873,#e9e969)}small{font-size:11px}.buttons{position:absolute;bottom:calc(15px + env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{pointer-events:auto;border:2px solid #ffe2a1;background:#f7ad42;border-radius:13px;padding:12px;font-weight:800;color:#493018}#win{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:#20543cf2;border:3px solid #ffda8b;border-radius:20px;padding:24px;text-align:center;display:none;min-width:240px}</style><div id="ui"><header><div class="panel"><h3>🐢 Kıyı Kurtarma Bölgesi</h3><div class="bar"><i id="fill"></i></div><small>Kurtarma XP: <b id="pct">0%</b></small></div><div class="panel"><b>MERGE EMPIRE</b><div><small>3D harita prototipi</small></div></div></header><div id="win"><h2>🐢 Kurtarıldı!</h2>Kaplumbağa denize ulaştı.<p>Balık familyası açıldı!</p></div><div class="buttons"><button id="order">📦 Sipariş +20 XP</button><button id="reset">↻ Yeniden başlat</button></div></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';const scene=new T.Scene();scene.background=new T.Color(0x9bd5ed);scene.fog=new T.Fog(0x9bd5ed,45,100);const cam=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,150),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.shadowMap.enabled=true;document.body.prepend(r.domElement);scene.add(new T.HemisphereLight(0xffffff,0x5b8755,2.5));const light=new T.DirectionalLight(0xffe3a8,3);light.position.set(-20,35,15);scene.add(light);const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.9}),grass=mat(0x70b45a),sand=mat(0xe9d29a),brown=mat(0x94623b),leaves=[mat(0x368a4b),mat(0x56a954),mat(0x82bf62)],blue=mat(0x34b5c8);function shape(g,m,x,y,z,parent=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(w,h,d,m,x,y,z,p){return shape(new T.BoxGeometry(w,h,d),m,x,y,z,p)}function ball(rad,m,x,y,z,p){return shape(new T.SphereGeometry(rad,12,9),m,x,y,z,p)}function cyl(a,b,h,m,x,y,z,p){return shape(new T.CylinderGeometry(a,b,h,9),m,x,y,z,p)}box(76,2,44,grass,0,-1.2,0);box(76,.3,13,sand,0,-.03,-15);box(76,.12,12,blue,0,-.03,-25);const path=[[-24,10],[-16,7],[-8,4],[0,0],[8,-4],[16,-8],[25,-13]];for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i],dx=b[0]-a[0],dz=b[1]-a[1];const q=box(Math.hypot(dx,dz)+1,.1,3.5,sand,(a[0]+b[0])/2,.05,(a[1]+b[1])/2);q.rotation.y=-Math.atan2(dz,dx)}for(let i=0;i<70;i++){let x=Math.sin(i*37.4)*35,z=Math.cos(i*15.9)*12+5;if(path.some(p=>Math.hypot(p[0]-x,p[1]-z)<4))continue;cyl(.3,.4,3,brown,x,1.5,z);for(let j=0;j<3;j++)ball(1.4,leaves[(i+j)%3],x+(j-1)*.7,3.2+j*.5,z)}for(let i=0;i<20;i++){let x=-34+i*3.5;ball(.4,sand,x,.3,-12.8)}const hero=new T.Group();scene.add(hero);cyl(.45,.5,1.3,mat(0xe37d34),0,1.4,0,hero);ball(.48,mat(0xffbb7c),0,2.35,0,hero);ball(.51,mat(0x382c2a),0,2.67,.1,hero);cyl(.57,.57,.16,mat(0xeac36b),0,2.87,0,hero);for(let x of [-.25,.25])cyl(.16,.17,.85,mat(0x40576e),x,.48,0,hero);for(let x of [-.55,.55])cyl(.13,.13,.8,mat(0xe37d34),x,1.4,0,hero);box(.9,.95,.3,mat(0x65845d),0,1.5,.5,hero);const turtle=new T.Group();scene.add(turtle);turtle.position.set(25,0,-15);const shell=ball(1,mat(0x597b3d),0,.9,0,turtle);shell.scale.set(1.25,.6,1);const head=ball(.47,mat(0x88b46c),0,.7,-1.2,turtle);for(let x of [-.85,.85])for(let z of [-.6,.6]){const foot=ball(.36,mat(0x86ad70),x,.3,z,turtle);foot.scale.set(1.2,.5,.8)}for(let x of [-.18,.18])ball(.08,mat(0x1c3329),x,.87,-1.57,turtle);const gate=new T.Group();scene.add(gate);gate.position.set(25,0,-12);for(let x of [-2,2])box(.4,3,.4,brown,x,1.5,0,gate);box(4.4,.3,.4,brown,0,2.8,0,gate);const door=new T.Group();door.position.x=-1.8;gate.add(door);for(let i=0;i<6;i++)box(.28,2.1,.2,brown,i*.6,1.1,0,door);let xp=0,progress=0,rescued=false,orbit=0,tilt=.62;const fill=document.getElementById('fill'),pct=document.getElementById('pct'),order=document.getElementById('order'),win=document.getElementById('win');function setXP(v){xp=Math.min(100,v);fill.style.width=xp+'%';pct.textContent=xp+'%';if(xp===100)order.disabled=true}order.onclick=()=>setXP(xp+20);document.getElementById('reset').onclick=()=>{setXP(0);order.disabled=false;progress=0;rescued=false;door.rotation.y=0;turtle.position.set(25,0,-15);win.style.display='none'};let down=false,px=0,py=0;r.domElement.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY});r.domElement.addEventListener('pointermove',e=>{if(!down)return;orbit+=(e.clientX-px)*.006;tilt=Math.max(.3,Math.min(1.1,tilt+(e.clientY-py)*.004));px=e.clientX;py=e.clientY});r.domElement.addEventListener('pointerup',()=>down=false);const clock=new T.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;progress+=(xp/100-progress)*Math.min(1,dt*.65);const pos=progress*(path.length-1),i=Math.min(path.length-2,Math.floor(pos)),a=pos-i;hero.position.set(path[i][0]*(1-a)+path[i+1][0]*a,Math.sin(t*9)*.04,path[i][1]*(1-a)+path[i+1][1]*a);hero.rotation.y=2.7;if(xp===100&&progress>.96){door.rotation.y=Math.min(1.5,door.rotation.y+dt*.6);if(door.rotation.y>1.3){rescued=true;win.style.display='block'}}if(rescued)turtle.position.z-=dt*.9;const focus=hero.position.clone().lerp(new T.Vector3(25,0,-12),.25);const dist=36;cam.position.lerp(new T.Vector3(focus.x+Math.sin(orbit)*dist,dist*Math.sin(tilt),focus.z+Math.cos(orbit)*dist),.07);cam.lookAt(focus.x,0,focus.z);r.render(scene,cam)}animate();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></html>
